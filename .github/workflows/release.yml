name: Release

# This workflow runs only by hand. It builds the package and keeps the files
# as a workflow artifact. It does not publish to PyPI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Run the tests
        run: |
          uv sync --locked
          uv run pytest

      - name: Build the sdist and the wheel
        run: uv build

      - name: Keep the built files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

      # To publish to PyPI later:
      # 1. Add the repository secret PYPI_API_TOKEN.
      # 2. Remove the comment marks from the step below.
      #
      # - name: Publish to PyPI
      #   run: uv publish
      #   env:
      #     UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
