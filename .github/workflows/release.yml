name: Release

# Builds the package and publishes it to PyPI with trusted publishing (OIDC).
# The publish job gets a short-lived token from GitHub. The repository has no
# PyPI secret. This workflow runs only by hand.
#
# Before the first release, add a pending publisher on PyPI: project snapsbrew,
# owner amedina068, repository snapsbrew-python, workflow release.yml,
# environment pypi. The first run creates the project on PyPI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Run the tests
        run: |
          uv sync --locked
          uv run pytest

      - name: Build the sdist and the wheel
        run: uv build

      - name: Keep the built files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Get the built files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
