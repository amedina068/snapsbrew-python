name: Feature request
description: Ask for a new feature in the Python client.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Write the problem that you want to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Write the API that you want. Give a short code example.
      render: python
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other solutions
      description: Write the other solutions that you examined.
